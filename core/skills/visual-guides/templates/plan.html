<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="source-sha256" content="{{SHA}}">
<title>{{TITLE}}</title>
<style>
:root{color-scheme:light dark;--bg:#fbfbfa;--fg:#1d1d1f;--mute:#5f6368;--card:#fff;--line:#d9d9d6;--acc:#1a56db;--ok:#137333;--warn:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#16171a;--fg:#ececec;--mute:#a0a4a8;--card:#202226;--line:#3a3d42;--acc:#8ab4f8;--ok:#81c995;--warn:#f28b82}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:860px;margin:0 auto;padding:32px 20px 64px}
h1{font-size:1.7rem;margin:0 0 .4em}h2{font-size:1.25rem;margin:1.8em 0 .5em;border-bottom:1px solid var(--line);padding-bottom:.2em}h3{font-size:1.05rem}
p,li{max-width:70ch}code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:0 .3em}
pre{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto}pre code{border:0;padding:0;background:none}
table{border-collapse:collapse;width:100%;margin:1em 0}th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}th{background:var(--card)}
.lead{color:var(--mute);margin:0 0 1.5em}
ul.criteria{list-style:none;padding:0}li.criterion{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:8px;padding:10px 14px;margin:10px 0}
.goal{font-size:1.15rem;font-weight:600;margin:0 0 1em}
svg.flow{display:block;color:var(--mute);max-width:100%;height:auto;margin:1em 0}svg.flow rect{fill:var(--card);stroke:var(--acc);stroke-width:1.5}svg.flow text{fill:var(--fg);font:13px system-ui,sans-serif}svg.flow text:first-of-type{font-weight:700;fill:var(--acc)}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:1em 0}.map>div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px}.map>div::before{display:block;font-size:.8rem;font-weight:700;text-transform:uppercase;color:var(--mute)}
.map [data-map=touched]{border-top:4px solid var(--acc)}.map [data-map=untouched]{border-top:4px solid var(--ok)}.map [data-map=removed]{border-top:4px solid var(--warn)}
.map [data-map=touched]::before{content:"touched"}.map [data-map=untouched]::before{content:"not touched"}.map [data-map=removed]::before{content:"removed"}
.before-after{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:1em 0}.before-after>*{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.matrix{overflow:auto;margin:1em 0}
.keep{border:2px solid var(--warn);border-radius:8px;padding:6px 14px;margin:1em 0}.keep>div{margin:.5em 0}.keep>div::before{display:block;font-size:.8rem;font-weight:700;text-transform:uppercase;color:var(--warn)}
.keep [data-keep=irreversible]::before{content:"irreversible actions"}.keep [data-keep=risks]::before{content:"open questions and risks"}.keep [data-keep=deviations]::before{content:"deviations from the handoff"}
.stale{position:sticky;top:0;z-index:9;margin:0;padding:10px 16px;background:var(--warn);color:#fff;font-weight:600;text-align:center}
@media (max-width:560px){.before-after{grid-template-columns:1fr}}
.slice-graph{overflow:auto}svg.slices{color:var(--mute);max-width:100%;height:auto}svg.slices rect{fill:var(--card);stroke:var(--acc);stroke-width:1.5}svg.slices text{fill:var(--fg);font:13px system-ui,sans-serif}svg.slices .id{font-weight:700}svg.slices .label{fill:var(--mute);font-size:11px}
</style>
</head>
<body>
<main>
{{BODY}}
</main>
</body>
</html>
