name: CI macOS

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The installer targets macOS (see README: Install). Hosted macOS runners are sometimes not assigned, so this
    # workflow is informational only and is kept apart from the blocking Ubuntu one in ci.yml.
    runs-on: macos-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the tests (guard, layers, bootstrap, install into a temporary home)
        run: python3 -I -m unittest discover -s tests -v
