name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Ubuntu is the gate: it is fast and always available. The installer targets macOS (see README: Install), so the macOS
    # run stays as a check, but hosted macOS runners are sometimes not assigned, so it cannot block.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the tests (guard, layers, bootstrap, install into a temporary home)
        run: python3 -I -m unittest discover -s tests -v
