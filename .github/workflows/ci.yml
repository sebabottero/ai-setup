name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The installer and its tests target macOS (see README: Install).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the tests (guard, layers, bootstrap, install into a temporary home)
        run: python3 -I -m unittest discover -s tests -v
