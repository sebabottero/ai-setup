name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Ubuntu is the gate: it is fast and always available. The macOS run lives in ci-macos.yml so a hosted macOS runner
    # that is never assigned cannot turn this workflow (and its README badge) red.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the tests (guard, layers, bootstrap, install into a temporary home)
        run: python3 -I -m unittest discover -s tests -v
