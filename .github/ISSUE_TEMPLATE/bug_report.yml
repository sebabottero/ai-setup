name: Bug report
description: Something does not work as the README says
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran and what you saw. Paste the exact error.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Minimal steps. For a guard decision, the exact command and the JSON the guard returned.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: macOS version, tool and version (Claude Code, OpenCode), python3 version.
